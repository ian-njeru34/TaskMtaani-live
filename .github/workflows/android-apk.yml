name: Build TaskMtaani Android test APK

on:
  push:
    branches: [main]
    paths:
      - 'android-app/**'
      - 'index.html'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Capacitor dependencies
        run: npm install
      - name: Generate Android project
        run: npx cap add android
      - name: Generate TaskMtaani launcher icons from saved brand logo
        run: |
          python -m pip install --quiet Pillow
          python scripts/generate-android-icons.py
      - name: Sync web wrapper
        run: npx cap sync android
      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk TaskMtaani-debug.apk
      - name: Publish test APK to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-test
          name: TaskMtaani Android Test Build
          prerelease: true
          generate_release_notes: true
          files: android-app/android/TaskMtaani-debug.apk
          fail_on_unmatched_files: true
